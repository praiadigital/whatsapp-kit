<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WhatsApp Kit — Praia Digital</title><meta name="description" content="Biblioteca de mensagens prontas para corretores e anfitriões do litoral."><link rel="canonical" href="https://praia.digital/whatsapp-kit/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}main{max-width:860px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin:10px 0}.msg{background:#f1f5f9;border-radius:10px;padding:12px;white-space:pre-wrap}.btn{display:inline-block;padding:8px 14px;border-radius:8px;background:#22c55e;color:#06281a;text-decoration:none;font-weight:700;border:0;cursor:pointer;margin-top:8px}input{padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin-bottom:10px}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/script-corretor/" style="color:#9fd8ff;margin-right:12px">Script Corretor</a><a href="https://praia.digital/crm-corretor/" style="color:#9fd8ff">CRM</a></nav><main><h1>💬 WhatsApp Kit</h1><p>Personalize com seu nome e copie as mensagens prontas.</p><p>Seu nome: <input id="me" value="Corretor(a)" oninput="render()"></p><div id="list"></div></main><script>const M=[['Boas-vindas ao lead','Olá! Aqui é {me} da Praia Digital 🌊 Recebi seu interesse em imóveis no litoral. Posso te mandar 3 opções que combinam com seu perfil?'],['Follow-up após visita','Oi! Passando para saber o que achou do imóvel de ontem. Se quiser, já separo a documentação para a proposta. Qualquer dúvida, estou por aqui! — {me}'],['Confirmação de reserva (temporada)','Reserva confirmada! 🎉 Check-in a partir das 15h. Seguem o endereço, o código da fechadura e o manual da casa. Ótima estadia! — {me}'],['Pós-estadia','Esperamos que tenha adorado! ⭐ Se puder deixar uma avaliação 5 estrelas, ajuda muito. E na próxima temporada você tem 10% de desconto direto comigo! — {me}'],['Reativação de lead frio','Olá! Surgiram novidades no litoral que lembram o que você procurava. Quer dar uma olhada? Sem compromisso 🙂 — {me}']];function render(){const me=document.getElementById('me').value;document.getElementById('list').innerHTML=M.map((m,i)=>'<div class="card"><h3>'+m[0]+'</h3><div class="msg" id="m'+i+'">'+m[1].replace('{me}',me)+'</div><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById(\'m'+i+'\').textContent);this.textContent=\'Copiado!\'">Copiar</button></div>').join('');}render();</script></body></html>
